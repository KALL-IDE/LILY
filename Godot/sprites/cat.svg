<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Pixel-art cat 16x16 scaled to 64x64 (each pixel = 4x4) -->
  <rect width="64" height="64" fill="#5DADE2"/>
  <!-- row 0 -->
  <!-- blank -->
  <!-- row 1 -->
  <!-- blank -->
  <!-- draw cat using rectangles -->
  <!-- using a small palette -->
  <!-- colors: body #8B5A2B (brown), fur #EED9C4 (cream), ear pink #F29AA3, eye #1B1B1B, outline #2C2C2C -->
  <!-- row 4 -->
  <g id="pixels" shape-rendering="crispEdges">
    <!-- row 2 -->
    <rect x="20" y="8" width="4" height="4" fill="#2C2C2C"/>
    <rect x="24" y="8" width="4" height="4" fill="#F29AA3"/>
    <rect x="28" y="8" width="4" height="4" fill="#2C2C2C"/>
    <!-- row 3 -->
    <rect x="16" y="12" width="4" height="4" fill="#2C2C2C"/>
    <rect x="20" y="12" width="4" height="4" fill="#8B5A2B"/>
    <rect x="24" y="12" width="4" height="4" fill="#EED9C4"/>
    <rect x="28" y="12" width="4" height="4" fill="#8B5A2B"/>
    <rect x="32" y="12" width="4" height="4" fill="#2C2C2C"/>
    <!-- row 4 -->
    <rect x="12" y="16" width="4" height="4" fill="#2C2C2C"/>
    <rect x="16" y="16" width="4" height="4" fill="#8B5A2B"/>
    <rect x="20" y="16" width="4" height="4" fill="#8B5A2B"/>
    <rect x="24" y="16" width="4" height="4" fill="#EED9C4"/>
    <rect x="28" y="16" width="4" height="4" fill="#8B5A2B"/>
    <rect x="32" y="16" width="4" height="4" fill="#8B5A2B"/>
    <rect x="36" y="16" width="4" height="4" fill="#2C2C2C"/>
    <!-- row 5 -->
    <rect x="12" y="20" width="4" height="4" fill="#8B5A2B"/>
    <rect x="16" y="20" width="4" height="4" fill="#EED9C4"/>
    <rect x="20" y="20" width="4" height="4" fill="#EED9C4"/>
    <rect x="24" y="20" width="4" height="4" fill="#8B5A2B"/>
    <rect x="28" y="20" width="4" height="4" fill="#EED9C4"/>
    <rect x="32" y="20" width="4" height="4" fill="#EED9C4"/>
    <rect x="36" y="20" width="4" height="4" fill="#8B5A2B"/>
    <!-- row 6 -->
    <rect x="12" y="24" width="4" height="4" fill="#8B5A2B"/>
