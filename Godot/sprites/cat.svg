    <rect x="28" y="24" width="4" height="4" fill="#1B1B1B"/>
    <rect x="32" y="24" width="4" height="4" fill="#EED9C4"/>
    <rect x="36" y="24" width="4" height="4" fill="#8B5A2B"/>
    <!-- row 7 -->
    <rect x="12" y="28" width="4" height="4" fill="#8B5A2B"/>
    <rect x="16" y="28" width="4" height="4" fill="#EED9C4"/>
    <rect x="20" y="28" width="4" height="4" fill="#EED9C4"/>
    <rect x="24" y="28" width="4" height="4" fill="#EED9C4"/>
    <rect x="28" y="28" width="4" height="4" fill="#EED9C4"/>
