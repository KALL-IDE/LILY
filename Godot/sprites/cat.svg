    <rect x="32" y="32" width="4" height="4" fill="#8B5A2B"/>
    <!-- row 9 (legs) -->
    <rect x="16" y="36" width="4" height="4" fill="#2C2C2C"/>
    <rect x="20" y="36" width="4" height="4" fill="#8B5A2B"/>
    <rect x="24" y="36" width="4" height="4" fill="#8B5A2B"/>
    <rect x="28" y="36" width="4" height="4" fill="#8B5A2B"/>
    <rect x="32" y="36" width="4" height="4" fill="#8B5A2B"/>
